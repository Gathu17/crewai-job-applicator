[project]
name = "job-app"
version = "0.1.0"
description = "AI-powered job application automation with CrewAI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]",
    "crewai-tools",
    "fastapi>=0.127.1",
    "langchain",
    "langchain-google-genai>=2.1.12",
    "langchain-openai",
    "openai",
    "pydantic>=2.11.10",
    "streamlit>=1.52.2",
    "pypdf>=5.0.0",
    "uvicorn[standard]>=0.40.0",
    "python-jobspy>=1.1.82",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
]
scraping = [
    "playwright>=1.40.0",
    "aiohttp>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "aiohttp>=3.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
